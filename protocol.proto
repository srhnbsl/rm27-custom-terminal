syntax = "proto3";
// Transcribed by field number from the supplied communication PDF, chapter 2.
message GameStatus {
 optional uint32 current_round=1; optional uint32 total_rounds=2;
 optional uint32 red_score=3; optional uint32 blue_score=4;
 optional uint32 current_stage=5; optional int32 stage_countdown_sec=6;
 optional int32 stage_elapsed_sec=7; optional bool is_paused=8;
 optional uint32 game_result=9; optional uint32 end_reason=10;
}
message GlobalUnitStatus {
 optional uint32 base_health=1; optional uint32 base_status=2; optional uint32 base_shield=3;
 optional uint32 outpost_R_health=4; optional uint32 outpost_R_status=5;
 optional uint32 enemy_base_health=6; optional uint32 enemy_base_status=7;
 optional uint32 enemy_base_shield=8; optional uint32 outpost_B_health=9;
 optional uint32 outpost_B_status=10; repeated uint32 robot_health=11;
 repeated int32 robot_bullets=12; optional uint32 total_damage_ally=13;
 optional uint32 total_damage_enemy=14; optional uint32 total_CP_ally=15; optional uint32 total_CP_enemy=16;
}
message GlobalLogisticsStatus {
 optional uint32 remaining_economy=1; optional uint64 total_economy_obtained=2;
 optional uint32 tech_level=3; optional uint32 encryption_level=4;
}
message RobotStaticStatus {
 optional uint32 connection_state=1; optional uint32 field_state=2; optional uint32 alive_state=3;
 optional uint32 robot_id=4; optional uint32 robot_type=5; optional uint32 performance_system_shooter=6;
 optional uint32 performance_system_chassis=7; optional uint32 level=8; optional uint32 max_health=9;
 optional uint32 max_heat=10; optional float heat_cooldown_rate=11; optional uint32 max_power=12;
 optional uint32 max_buffer_energy=13; optional uint32 max_chassis_energy=14;
}
message RobotDynamicStatus {
 optional uint32 current_health=1; optional float current_heat=2; optional float last_projectile_fire_rate=3;
 optional uint32 reserved=4; optional uint32 current_buffer_energy=5;
 optional uint32 current_experience=6; optional uint32 experience_for_upgrade=7;
 optional uint32 total_projectiles_fired=8; optional uint32 remaining_ammo=9;
 optional bool is_out_of_combat=10; optional uint32 out_of_combat_countdown=11;
 optional bool can_remote_heal=12; optional bool can_remote_ammo=13;
}
message RobotPosition {
 optional float x=1; optional float y=2; optional float z=3;
 optional float yaw=4; optional uint32 robot_id=5;
}
message Event { optional int32 event_id=1; optional string param=2; }
message PenaltyInfo {
 optional uint32 penalty_type=1; optional uint32 penalty_effect_sec=2; optional uint32 total_penalty_num=3;
}
message RobotModuleStatus {
 optional uint32 power_manager=1; optional uint32 rfid=2; optional uint32 light_strip=3;
 optional uint32 small_shooter=4; optional uint32 big_shooter=5; optional uint32 uwb=6;
 optional uint32 armor=7; optional uint32 video_transmission=8; optional uint32 capacitor=9;
 optional uint32 main_controller=10; optional uint32 modular_42mm=11;
}
message Buff {
 optional uint32 robot_id=1; optional uint32 buff_type=2; optional int32 buff_level=3;
 optional uint32 buff_max_time=4; optional uint32 buff_left_time=5;
}
message MapClickInfo {
 optional uint32 is_send_all=1; optional bytes robot_id=2; optional uint32 mode=3;
 optional uint32 enemy_id=4; optional uint32 ascii=5; optional uint32 type=6;
 optional float map_x=7; optional float map_y=8;
}
// RadarInfoToClient deliberately excluded: the supplied PDF has an invalid
// repeated uint32 RadarSingleRobotInfo declaration with no field number.
